[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quivasp"
version = "0.1.0"
description = "A Python package for VASP-related workflows and analysis."
readme = "README.md"
requires-python = ">=3.9"

license = "MIT"
license-files = ["LICENSE"]

authors = [
    {name = "Quivasp contributors"}
]

dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = [
    "pytest>=7"
]

[project.urls]
Homepage = "https://github.com/timeti123553/Quivasp"
Repository = "https://github.com/timeti123553/Quivasp"
Issues = "https://github.com/timeti123553/Quivasp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]